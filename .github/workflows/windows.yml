name: Central Alimentos Wilson
on:
  workflow_dispatch:
    inputs:
      central_only:
        description: Compilar e testar somente o launcher
        type: boolean
        default: false
      reuse_word_run:
        description: Execução anterior com o MSI Word AW validado
        type: string
        default: ''
      reuse_excel_run:
        description: Execução anterior com o MSI Excel AW validado
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  installers:
    if: ${{ !inputs.central_only }}
    name: Instalador ${{ matrix.app }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Excel
            repository: CaioRods/Excel-AW
            revision: 796bfd8f90b5fee2a63cb3c6fab631e867e2a865
            package: gridcraft
          - app: Word
            repository: CaioRods/Word-AW
            revision: 24de1d04396df18f371cfe10ca8818fff01db12d
            package: wordcraft
    steps:
      - uses: actions/checkout@v4
        with:
          path: central
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: app
          persist-credentials: false
      - if: matrix.app == 'Word'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-i18n
          ref: 1e515422afdda2f317af430c1f9d68a5f83935b4
          path: craft-i18n
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - name: Preparar compilação x64
        if: (matrix.app != 'Word' || inputs.reuse_word_run == '') && (matrix.app != 'Excel' || inputs.reuse_excel_run == '')
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Gerar MSI
        if: (matrix.app != 'Word' || inputs.reuse_word_run == '') && (matrix.app != 'Excel' || inputs.reuse_excel_run == '')
        working-directory: app
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: |
          if ('${{ matrix.app }}' -eq 'Word') {
            $env:CRAFT_I18N_DIR = "$env:GITHUB_WORKSPACE\craft-i18n"
            $env:CRAFT_I18N_REQUIRED = '1'
            if ((Get-Content craft-i18n.rev -Raw).Trim() -ne (git -C $env:CRAFT_I18N_DIR rev-parse HEAD)) {
              throw 'A revisão do catálogo de idiomas diverge do Word AW.'
            }
          }
          ../central/launcher/brand-msi.ps1 -Source . -App '${{ matrix.app }}'
          ./packaging/windows/package.ps1 -Arch x64
          $msi = @(Get-ChildItem dist/release -Filter '${{ matrix.package }}-*-windows-x64.msi')
          if ($msi.Count -ne 1) { throw 'Esperava exatamente um MSI x64.' }
          Copy-Item $msi[0].FullName "$env:RUNNER_TEMP\${{ matrix.app }}-AW-x64.msi"
      - uses: actions/download-artifact@v4
        if: (matrix.app == 'Word' && inputs.reuse_word_run != '') || (matrix.app == 'Excel' && inputs.reuse_excel_run != '')
        with:
          name: ${{ matrix.app }}-AW-x64
          run-id: ${{ matrix.app == 'Word' && inputs.reuse_word_run || inputs.reuse_excel_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Validar instalação e reconhecimento
        run: ./central/launcher/test-msi.ps1 -Package "$env:RUNNER_TEMP\${{ matrix.app }}-AW-x64.msi" -Name "${{ matrix.app }} AW"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-AW-x64
          path: ${{ runner.temp }}/${{ matrix.app }}-AW-x64.msi
          if-no-files-found: error

  central:
    name: Compilar a central
    timeout-minutes: 10
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compilar e testar inicialização
        env:
          AWCONTROL_TEST_SCREENSHOTS: ${{ runner.temp }}\aw-previews
        run: |
          New-Item -ItemType Directory central | Out-Null
          ./launcher/build.ps1 -Destination central
      - uses: actions/upload-artifact@v4
        with:
          name: Central-executavel
          path: central/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWcontrol-UI-previews
          path: ${{ runner.temp }}/aw-previews/
          if-no-files-found: error

  regressions:
    if: ${{ !inputs.central_only }}
    name: Regressões ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Excel
            repository: CaioRods/Excel-AW
            revision: 796bfd8f90b5fee2a63cb3c6fab631e867e2a865
          - app: Word
            repository: CaioRods/Word-AW
            revision: 24de1d04396df18f371cfe10ca8818fff01db12d
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - name: Preparar testes de interface
        if: (matrix.app != 'Word' || inputs.reuse_word_run == '') && (matrix.app != 'Excel' || inputs.reuse_excel_run == '')
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev
      - name: Validar seleção, navegação e superfícies
        if: (matrix.app != 'Word' || inputs.reuse_word_run == '') && (matrix.app != 'Excel' || inputs.reuse_excel_run == '')
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          if [ '${{ matrix.app }}' = 'Excel' ]; then
            cargo test --locked -p gridcraft-ui-egui --test it drag_cursor::ctrl_ -- --nocapture
            cargo test --locked -p gridcraft-ui-egui --lib aw_surface_tests -- --nocapture
            cargo test --locked -p gridcraft-ui-egui --lib aw_workspace_action_tests -- --nocapture
            cargo test --locked -p gridcraft-engine --lib aw_rename_tests -- --nocapture
            cargo test --locked -p gridcraft-engine --lib aw_template_tests -- --nocapture
            cargo test --locked -p gridcraft-engine --lib aw_selected_checkpoint -- --nocapture
            cargo test --locked -p gridcraft-ui-egui --lib aw_deselection_tests -- --nocapture
            cargo test --locked -p gridcraft-ui-egui --test it file_menu::aw_sidebar_ -- --nocapture
            cargo test --locked -p gridcraft-ui-egui --test it file_menu::hosted_excel_dont_save -- --nocapture
          else
            cargo test --locked -p wordcraft-ui-egui --lib backstage::tests::aw_sidebar_ -- --nocapture
            cargo test --locked -p wordcraft-ui-egui --lib aw_surface_tests -- --nocapture
            cargo test --locked -p wordcraft-ui-egui --lib aw_host_tests -- --nocapture
            cargo test --locked -p wordcraft-engine --lib aw_portuguese_templates -- --nocapture
            cargo test --locked -p wordcraft-engine --lib aw_selected_word_checkpoint -- --nocapture
            cargo test --locked -p wordcraft --bin wordcraft control_server::tests::an_accept_thread_spawn_failure -- --nocapture
            cargo test --locked -p wordcraft-ui-egui --lib every_side_menu_item_has_a_drawn_icon -- --nocapture
          fi

      - name: Verificar regressões do pacote reutilizado
        if: (matrix.app == 'Word' && inputs.reuse_word_run != '') || (matrix.app == 'Excel' && inputs.reuse_excel_run != '')
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ matrix.app == 'Word' && inputs.reuse_word_run || inputs.reuse_excel_run }}
          APP: ${{ matrix.app }}
          REVISION: ${{ matrix.revision }}
        run: |
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]] || exit 1
          passed=$(gh api "repos/CaioRods/Launcher-Wilson/actions/runs/$REUSE_RUN/jobs?per_page=100" | jq -r --arg name "Regressões $APP" '.jobs[] | select(.name == $name) | .conclusion')
          [ "$passed" = success ] || exit 1
          source=$(gh api "repos/CaioRods/Launcher-Wilson/actions/runs/$REUSE_RUN" --jq .head_sha)
          gh api "repos/CaioRods/Launcher-Wilson/contents/.github/workflows/windows.yml?ref=$source" --jq .content | base64 -d > previous.yml
          grep -F "revision: $REVISION" previous.yml

  bundle:
    if: ${{ !inputs.central_only }}
    name: Montar o ZIP final
    timeout-minutes: 10
    needs: [installers, central, regressions]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Central-executavel
          path: pacote
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-AW-x64'
          path: pacote/instaladores
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: central-source
          persist-credentials: false
      - name: Validar Excel e Word reais dentro do AWcontrol
        env:
          AWCONTROL_TEST_SCREENSHOTS: ${{ runner.temp }}\aw-real-previews
        run: ./central-source/launcher/test-workspace-installed.ps1 -Packages pacote/instaladores
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWcontrol-real-editors-previews
          path: ${{ runner.temp }}/aw-real-previews/
          if-no-files-found: error
      - name: Verificar o conteúdo e montar pacote
        run: |
          foreach ($app in @('Excel','Word')) {
            if (!(Test-Path "pacote/instaladores/$app-AW-x64.msi" -PathType Leaf)) { throw "MSI ausente: $app AW" }
          }
          Compress-Archive -Path pacote/* -DestinationPath AWcontrol-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AWcontrol-Windows-x64
          path: AWcontrol-Windows-x64.zip
          if-no-files-found: error
